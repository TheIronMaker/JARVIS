[project]
name = "jarvis"
version = "0.0.1"
description = "Stark Industries JARVIS"
authors = [{name = "Andrew Morris"}]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "jarvis-core",
    "jarvis-app",
    "jarvis-modules[all]"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/jarvis-core",
    "packages/jarvis-app",
    "packages/jarvis-modules"
]

[tool.uv.sources]
jarvis-core = { workspace = true }
jarvis-app = { workspace = true }
jarvis-modules = { workspace = true }
