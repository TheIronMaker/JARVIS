[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-stt"
version = "0.1.0"
description = "Jarvis Speech to Text"
requires-python = ">=3.11"

dependencies = [] # <- Third party libraries go here or in optional-dependencies extras for extra features

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
jarvis-stt = { workspace = true }