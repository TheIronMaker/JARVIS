[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.0.1"
description = "The core JARVIS module that all JARVIS systems may depend on."
authors = [{name = "Andrew Morris"}]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

dependencies = [
    "pyzmq",
    "msgpack",
    "opencv-python-headless",
    "platformdirs",
    "deepmerge",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]